aid: levelup
name: LevelUp
description: 'LevelUp (SCVNGR, Inc. d/b/a LevelUp) was a Boston-based mobile payments and customer-loyalty
  platform whose REST API let point-of-sale systems and e-commerce applications accept LevelUp payments,
  issue QR-code order tokens, manage merchant locations, and run merchant-funded loyalty and credit
  campaigns. The platform shipped first-party C#, Ruby and Java SDKs plus packaged point-of-sale adapters
  for Aloha, Micros 3700, Dinerware and Agilysys InfoGenesis. LevelUp was acquired by Grubhub in 2018 and
  the platform API is now RETIRED: the developer portal, API reference, sandbox and production hosts have
  all been decommissioned and thelevelup.com redirects to grubhub.com. This profile is a historical record
  reconstructed from LevelUp''s surviving first-party open-source SDKs and package feeds.'
